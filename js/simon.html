<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="simon.css">
    <script src="simon.js" defer></script>
</head>
<body>
    <h1>Simon Game</h1>
    <h3>Press any key to start</h3>
    <div class="game">
        <div class="upper">
            <div class="red" id="box"></div>
            <div class="green" id="box"></div>
        </div>
        <div class="lower">
            <div class="blue" id="box"></div>
            <div class="yellow" id="box"></div>
        </div>
    </div>
</body>
</html>
