<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project 1</title>
    <link rel="stylesheet" href="miniproject.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main_box">
        <input type="checkbox" id="check">
        <div class="button1">
            <label for="check"><i class="fa-solid fa-bars"></i></label>
        </div>
    
    <div class="navbar">
        <div class="logo">
            <a href="#">ABES COLLEGE</a>
        </div>
        <div class="button2"><label for="check">
            <i class="fa-solid fa-xmark"></i></label>
        </div>
        <div class="menu">
            <ul>

                <li><i class="fa-solid fa-image"></i> <a href="#">Gallery</a></li>
                <li><a href="#"><i class="fa-solid fa-square-up-right"></i> Shortcut</a></li>
                <li><a href="#"><i class="fa-solid fa-images"></i> Exhibit</a></li>
                <li><a href="#"><i class="fa-solid fa-calendar-days"></i> Event</a></li>
                <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> Store</a></li>
                <li><a href="#"><i class="fa-solid fa-phone"></i> Contact</a></li>
                <li> <a href="#"><i class="fa-solid fa-comments"></i> Feedback</a></li>
            </ul>
        </div>
        <span class="social">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </span>
    </div>
    </div>
